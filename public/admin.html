<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red Chilly Admin</title>
    <meta name="theme-color" content="#d93f30" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        background: #fffaf6;
      }

      .admin-shell {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 16px 48px;
      }

      .admin-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
      }

      .admin-card {
        background: white;
        border: 1px solid #f1d6c8;
        border-radius: 22px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        padding: 22px;
      }

      .admin-card h3 {
        margin-top: 0;
      }

      .stats-box {
        display: grid;
        gap: 12px;
      }

      .stat {
        border: 1px solid #f1d6c8;
        background: #fff5ee;
        border-radius: 16px;
        padding: 14px;
      }

      .stat strong {
        display: block;
        font-size: 1.5rem;
        margin-top: 4px;
      }

      .data-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }

      .data-item {
        border: 1px solid #f1d6c8;
        background: #fff7f2;
        border-radius: 14px;
        padding: 12px;
      }

      .data-item small {
        color: #666;
      }
    </style>
  </head>
  <body>
    <main class="admin-shell">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Admin panel</p>
          <h3>Red Chilly dashboard</h3>
        </div>
        <a class="btn btn-secondary" href="/">Back to website</a>
      </div>

      <div class="admin-grid">
        <section class="admin-card">
          <h3>Overview</h3>
          <div class="stats-box">
            <div class="stat">
              <small>Total orders</small>
              <strong id="admin-order-count">0</strong>
            </div>
            <div class="stat">
              <small>Total enquiries</small>
              <strong id="admin-enquiry-count">0</strong>
            </div>
          </div>
        </section>

        <section class="admin-card">
          <h3>Recent orders</h3>
          <ul id="admin-orders" class="data-list"></ul>
        </section>

        <section class="admin-card">
          <h3>Recent enquiries</h3>
          <ul id="admin-enquiries" class="data-list"></ul>
        </section>
      </div>
    </main>

    <script src="/admin.js"></script>
  </body>
</html>
